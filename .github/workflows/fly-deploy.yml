# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: movie_miniapp_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movie_miniapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/movie_miniapp_test
      # Public CI has no Telegram bot secret. Exercise the real HMAC path with
      # a disposable, non-production key instead of weakening token signing.
      WISHLIST_PREPARE_SECRET: ci-only-wishlist-prepare-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      # Two steps, not one: hashes in requirements.txt turn on --require-hashes
      # for the whole pip invocation, and the dev file deliberately has none —
      # those packages never reach the image.
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check backend scripts
      - run: python -m compileall -q backend scripts
      - run: node --check frontend/app.js
      - run: npm ci
      - run: npm run lint
      # Advisory, not a gate: dev dependencies never reach the image
      # (.dockerignore excludes node_modules), so an advisory in someone
      # else's transitive dev package must not block a production deploy.
      # pip-audit below stays blocking — those packages do ship.
      - name: npm audit (advisory only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, pinned 2026-07-23
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Without this the job is green the moment flyctl returns, even if the
      # machine comes up and immediately crashes.
      - name: Smoke test production
        run: |
          for attempt in $(seq 1 24); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' https://addict-film.fly.dev/healthz || echo 000)
            if [ "$code" = "200" ]; then echo "healthy after ${attempt} attempt(s)"; exit 0; fi
            sleep 5
          done
          echo "::error::/healthz never returned 200 within 2 minutes after deploy"
          exit 1
