# fly.toml app configuration file generated for addict-film on 2026-07-13T19:26:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'addict-film'
primary_region = 'fra'

[build]

[env]
  DB_PATH = '/data/movies.db'

# Том потрібен лише у SQLite-режимі (DB_PATH). Якщо в проді заданий DATABASE_URL
# (Postgres/Neon) — том зайвий, але безпечний (просто не використовується).
# Щоб прибрати: `fly volume destroy movies_data` (інтерактивно через flyctl).
[[mounts]]
  processes = ['app']
  source = 'movies_data'
  destination = '/data'

# Обогащение каталога — отдельная группа процессов: воркер не должен ни получать
# публичный HTTP, ни делить память с веб-процессом. `processes` в http_service
# гарантирует, что трафик идёт только в web.
# Группа веб-процесса называется `app` — так же, как существующие машины. Иначе
# Fly считает `web` новой группой, пытается поднять новые машины и упирается в
# том, уже занятый работающими: деплой падает, а прод остаётся на старой версии.
[processes]
  app = "sh -c 'uvicorn main:app --host 0.0.0.0 --port ${PORT:-8080}'"
  worker = "python -m enrichment.worker"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  processes = ['app']
  size = 'shared-cpu-1x'
  memory = '256mb'

# Том нужен только веб-процессу в SQLite-режиме: в облаке база — Postgres, и
# воркеру монтировать нечего (том Fly нельзя подключить к двум машинам сразу).
[[vm]]
  processes = ['worker']
  size = 'shared-cpu-1x'
  memory = '256mb'
